version = 1

# Everything is AGPL code unless a later annotation says otherwise.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Atlas 21 Inc."
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Commercial font, used under licence; not open source.
[[annotations]]
path = ["src/assets/fonts/Marlide-Display-Bold.ttf"]
precedence = "override"
SPDX-FileCopyrightText = "2022 Kontour Type, LLC"
SPDX-License-Identifier = "LicenseRef-Proprietary-Fonts"

# Roboto, under the SIL Open Font License.
[[annotations]]
path = ["src/assets/fonts/Roboto-*.ttf"]
precedence = "override"
SPDX-FileCopyrightText = "2011 The Roboto Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# BOLT test vectors from lightning/bolts.
[[annotations]]
path = ["test/fixtures/*.json"]
precedence = "override"
SPDX-FileCopyrightText = "The lightning/bolts contributors"
SPDX-License-Identifier = "CC-BY-4.0"
